name: network-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: تست مستقیم ستادیران
        run: |
          for host in gw.setadiran.ir etend.setadiran.ir eproc.setadiran.ir fe.setadiran.ir; do
            echo "=== $host ==="
            curl -sS -o /dev/null -m 30 -w "http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" \
              "https://$host/" 2>&1 || echo "CURL-FAILED $host"
          done
          echo "=== gw api (real endpoint) ==="
          curl -sS -m 40 "https://gw.setadiran.ir/api/centralboard/cards/?searchTypeCode=0&selectedCities=430-444&queryText=&pageNumber=1&pageSize=1&sort=insertDate,desc" -w "\nhttp=%{http_code} total=%{time_total}s\n" 2>&1 | tail -3 || true
      - name: تست از طریق پراکسی‌های عمومی
        run: |
          TARGET="https://gw.setadiran.ir/api/centralboard/cards/?searchTypeCode=0&selectedCities=430-444&queryText=&pageNumber=1&pageSize=1&sort=insertDate,desc"
          echo "=== allorigins ==="
          curl -sS -m 60 "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$TARGET")" -w "\nhttp=%{http_code} total=%{time_total}s\n" 2>&1 | tail -3 || echo FAILED
          echo "=== corsproxy.io ==="
          curl -sS -m 60 "https://corsproxy.io/?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$TARGET")" -w "\nhttp=%{http_code} total=%{time_total}s\n" 2>&1 | tail -3 || echo FAILED
          echo "=== codetabs ==="
          curl -sS -m 60 "https://api.codetabs.com/v1/proxy?quest=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$TARGET")" -w "\nhttp=%{http_code} total=%{time_total}s\n" 2>&1 | tail -3 || echo FAILED
