name: گزارش روزانه فردیس

on:
  schedule:
    # 11:30 UTC = 15:00 به وقت ایران (UTC+3:30 ثابت)
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fardis-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: نصب وابستگی‌ها و مرورگر
        run: |
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: اجرای پایپ‌لاین گزارش
        run: node run_pipeline.mjs

      - name: ثبت تاریخچه و گزارش در ریپو
        if: always()
        run: |
          git config user.name "fardis-tender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setadiran-data
          if [ -f .qa_ok ]; then git add report.html report.pdf; fi
          git diff --cached --quiet || git commit -m "گزارش روزانه $(date -u +%Y-%m-%d)"
          git push

      - name: خلاصه اجرا
        if: always()
        run: |
          [ -f summary.md ] && cat summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/configure-pages@v5
        if: success()

      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: success()
