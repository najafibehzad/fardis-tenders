name: network-test2

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: تست مسیرهای جایگزین
        run: |
          TARGET="https://gw.setadiran.ir/api/centralboard/cards/?searchTypeCode=0&selectedCities=430-444&queryText=&pageNumber=1&pageSize=1&sort=insertDate,desc"
          echo "=== r.jina.ai (reader relay) ==="
          curl -sS -m 90 -H "X-Return-Format: text" "https://r.jina.ai/$TARGET" -w "\nhttp=%{http_code} total=%{time_total}s\n" 2>&1 | tail -4 || echo FAILED
          echo "=== microlink ==="
          curl -sS -m 60 "https://api.microlink.io/?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$TARGET")" -w "\nhttp=%{http_code} total=%{time_total}s\n" 2>&1 | tail -2 || echo FAILED
          echo "=== direct http port 80 ==="
          curl -sS -o /dev/null -m 20 "http://gw.setadiran.ir/" -w "http=%{http_code} connect=%{time_connect}s\n" 2>&1 || echo FAILED
          echo "=== dns resolve check ==="
          getent hosts gw.setadiran.ir || nslookup gw.setadiran.ir 2>&1 | tail -3
